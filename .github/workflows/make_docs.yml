name: Build documentation for all releases

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rocker/verse:latest

    steps:
      - name: Check out repository and all tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install documentation tools
        run: |
          Rscript -e 'install.packages(
            c("pkgdown", "remotes"),
            repos = "https://cloud.r-project.org"
          )'

      - name: Cache Documentation Builds
        id: docs-cache
        uses: actions/cache@v5
        with:
          path: site-output/versions
          key: docs-versions-${{ github.run_id }}
          restore-keys: |
            docs-versions-

      - name: Build all released documentation
        shell: bash
        run: |
          set -euo pipefail

          SITE_OUT="$GITHUB_WORKSPACE/site-output"
          VERSIONS_DIR="$SITE_OUT/versions"

          mkdir -p "$VERSIONS_DIR"

          # Find stable X.Y.Z tags, newest first.
          mapfile -t TAGS < <(
            git tag --list --sort=version:refname |
              grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' || true
          )

          if [ "${#TAGS[@]}" -eq 0 ]; then
            echo "No stable version tags found."
            exit 1
          fi

          echo "Release tags found:"
          printf '  %s\n' "${TAGS[@]}"

          # Remove cached versions whose tags no longer exist.
          for existing in "$VERSIONS_DIR"/*; do
            [ -d "$existing" ] || continue
            existing_tag="${existing##*/}"

            if ! printf '%s\n' "${TAGS[@]}" |
                grep -Fxq -- "$existing_tag"; then
              echo "Removing obsolete version: $existing_tag"
              rm -rf -- "$existing"
            fi
          done

          # Build or reuse each release, newest first.
          for tag in "${TAGS[@]}"; do
            VERSION_OUT="$VERSIONS_DIR/$tag"
            MARKER="$VERSION_OUT/.build-complete"

            if [ -f "$VERSION_OUT/index.html" ] &&
               [ -f "$MARKER" ]; then
              echo "Reusing cached documentation for $tag"
            else
              echo "Building documentation for $tag"

              # Discard incomplete output before rebuilding.
              rm -rf -- "$VERSION_OUT"

              SRC="$(mktemp -d "$RUNNER_TEMP/pkg-site-XXXXXX")"
              LIB="$RUNNER_TEMP/Rlib-${tag//[^a-zA-Z0-9_.-]/_}"
              mkdir -p "$LIB"

              # Extract the exact tagged source.
              git archive "$tag" | tar -x -C "$SRC"

              (
                cd "$SRC"
                export R_LIBS_USER="$LIB"

                Rscript -e \
                  'remotes::install_deps(".", dependencies = TRUE)'

                Rscript -e \
                  'pkgdown::build_site_github_pages(
                    dest_dir = "docs",
                    clean = TRUE,
                    install = TRUE
                  )'
              )

              # Only mark the version complete after a successful build.
              mkdir -p "$VERSION_OUT"
              cp -a "$SRC/docs/." "$VERSION_OUT/"
              touch "$MARKER"

              rm -rf "$SRC"
            fi

            # Always reconstruct the root from the newest release.
            if [ "$tag" = "${TAGS[0]}" ]; then
              echo "Publishing $tag as the homepage"
              cp -a "$VERSION_OUT/." "$SITE_OUT/"
              rm -f "$SITE_OUT/.build-complete"
            fi
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-output
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5